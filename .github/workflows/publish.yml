name: publish

on:
  # weekly. the quarterly files only change four times a year, so this is about keeping
  # the hosted signals current rather than about new data
  schedule:
    - cron: "40 6 * * 1"
  workflow_dispatch:
    inputs:
      quarter:
        description: quarter to load, for example 2024q1
        default: "2024q1"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: faers
          POSTGRES_PASSWORD: faers
          POSTGRES_DB: faers
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faers"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: faers
      PGPASSWORD: faers
      PGDATABASE: faers
      CLOUD_DATABASE_URL: ${{ secrets.CLOUD_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # the quarterly zip is about 67 MB and takes a couple of minutes to load. the zip
      # itself is not cached because it changes every quarter
      - name: Load the quarterly files
        run: python bulk_ingest.py --quarter "${{ github.event.inputs.quarter || '2024q1' }}" --replace

      - name: Publish the signals
        run: python publish.py --top 1000 --require-full

      - name: Show the run log
        run: python run.py --status
