services:
  postgres:
    image: postgres:16-alpine
    container_name: faers-postgres
    environment:
      POSTGRES_USER: faers
      POSTGRES_PASSWORD: faers
      POSTGRES_DB: faers
    ports:
      - "5432:5432"
    volumes:
      - faers-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faers -d faers"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  faers-pgdata:
