[pytest]
# The default cache directory cannot be created in this environment, and the
# fallback leaves pytest-cache-files-* directories in the project root.
addopts = -p no:cacheprovider
# norecursedirs replaces the defaults rather than adding to them, so the usual
# entries are repeated here. The last two are this project's scratch directories,
# which are unreadable and would otherwise break collection.
norecursedirs = .* build dist CVS _darcs {arch} *.egg venv .venv __pycache__ .piptmp pytest-cache-files-*
